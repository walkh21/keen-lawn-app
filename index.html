<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#163d2a">

  <title>Keen Lawn</title>

  <style>
  :root {
    --navy: #0d2b3d;
    --navy-light: #173f57;
    --blue: #176b9a;
    --blue-dark: #12587f;
    --blue-soft: #e9f3f8;
    --page: #f4f7f9;
    --white: #ffffff;
    --text: #17232d;
    --muted: #718092;
    --line: #d9e2e8;
    --green: #2e8b45;
    --green-soft: #e9f6ec;
    --danger: #a12622;
    --shadow: 0 2px 8px rgba(15, 43, 61, 0.07);
    --radius: 15px;
  }

  * {
    box-sizing: border-box;
  }

  html {
    -webkit-text-size-adjust: 100%;
  }

  body {
    margin: 0;
    font-family:
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      Arial,
      sans-serif;
    background: var(--page);
    color: var(--text);
    min-height: 100vh;
  }

  /* =========================
     HEADER
     ========================= */

  header {
    background: var(--white);
    color: var(--text);
    padding:
      calc(20px + env(safe-area-inset-top))
      22px
      20px;
    border-bottom: 1px solid var(--line);
  }

  header h1 {
    margin: 0;
    font-size: 27px;
    line-height: 1.1;
    font-weight: 800;
    letter-spacing: -0.5px;
  }

  header p {
    margin: 5px 0 0;
    color: var(--muted);
    font-size: 14px;
  }

  /* =========================
     MAIN APP AREA
     ========================= */

  main {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding: 20px;
  }

  /* =========================
     CARDS
     ========================= */

  .card {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }

  .card h2 {
    margin: 0 0 14px;
    font-size: 21px;
    line-height: 1.2;
    font-weight: 800;
    letter-spacing: -0.25px;
  }

  .card h3 {
    margin: 0 0 12px;
    font-size: 18px;
    font-weight: 750;
  }

  h2,
  h3 {
    color: var(--text);
  }

  p {
    line-height: 1.5;
  }

  /* =========================
     DASHBOARD TOP
     ========================= */

  .dashboard-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;

    background: var(--white);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }

  .dashboard-top strong {
    display: block;
    font-size: 18px;
    font-weight: 800;
  }

  .dashboard-top button {
    width: auto;
    min-width: 88px;
    margin: 0;
  }

  /* =========================
     FORMS
     ========================= */

  label {
    display: block;
    margin: 16px 0 6px;
    color: #34434f;
    font-size: 13px;
    font-weight: 700;
  }

  input,
  select,
  textarea {
    width: 100%;
    min-height: 48px;
    padding: 12px 13px;
    border: 1px solid #cfd9df;
    border-radius: 10px;
    background: var(--white);
    color: var(--text);
    font: inherit;
    font-size: 16px;
    outline: none;
    transition:
      border-color 0.15s ease,
      box-shadow 0.15s ease;
  }

  input:focus,
  select:focus,
  textarea:focus {
    border-color: var(--blue);
    box-shadow:
      0 0 0 3px rgba(23, 107, 154, 0.12);
  }

  textarea {
    min-height: 100px;
    resize: vertical;
  }

  /* =========================
     BUTTONS
     ========================= */

  button {
    width: 100%;
    min-height: 46px;
    margin-top: 14px;
    padding: 11px 16px;
    border: 0;
    border-radius: 10px;
    background: var(--blue);
    color: var(--white);
    font: inherit;
    font-size: 15px;
    font-weight: 750;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  button:active {
    transform: translateY(1px);
  }

  button:hover {
    background: var(--blue-dark);
  }

  button.secondary {
    background: var(--blue-soft);
    color: var(--blue-dark);
  }

  button.secondary:hover {
    background: #dcecf4;
  }

  /* =========================
     CLIENT / JOB ROWS
     ========================= */

  .client {
    padding: 15px 0;
    border-top: 1px solid #e5ebef;
  }

  .client:first-child {
    border-top: 0;
  }

  .client-name {
    color: var(--text);
    font-size: 16px;
    line-height: 1.3;
    font-weight: 800;
  }

  .client-detail {
    margin-top: 5px;
    color: #657481;
    font-size: 14px;
    line-height: 1.45;
  }

  .client button {
    margin-top: 10px;
  }

  /* =========================
     EMPTY / STATUS MESSAGES
     ========================= */

  .empty {
    margin: 0;
    padding: 18px 8px;
    color: var(--muted);
    text-align: center;
    font-size: 14px;
  }

  .message {
    margin-top: 12px;
    color: #566571;
    font-size: 14px;
    line-height: 1.4;
  }

  .hidden {
    display: none !important;
  }

  /* =========================
     PHOTOS
     ========================= */

  img {
    max-width: 100%;
  }

  /* =========================
     SCROLLBARS
     ========================= */

  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }

  ::-webkit-scrollbar-thumb {
    background: #c8d4db;
    border-radius: 20px;
  }

  /* =========================
     TABLET / DESKTOP
     ========================= */

  @media (min-width: 760px) {
    main {
      padding: 28px 24px 50px;
    }

    .card {
      padding: 24px;
    }

    header {
      padding-left: max(
        24px,
        calc((100vw - 760px) / 2 + 24px)
      );

      padding-right: max(
        24px,
        calc((100vw - 760px) / 2 + 24px)
      );
    }
  }

  /* =========================
     MOBILE
     ========================= */

  @media (max-width: 520px) {
    header {
      padding-left: 20px;
      padding-right: 20px;
    }

    header h1 {
      font-size: 25px;
    }

    main {
      padding: 16px;
    }

    .card {
      padding: 18px;
      border-radius: 14px;
      margin-bottom: 14px;
    }

    .dashboard-top {
      padding: 14px 16px;
    }

    .dashboard-top strong {
      font-size: 16px;
    }

    .dashboard-top button {
      min-width: auto;
      padding-left: 13px;
      padding-right: 13px;
      font-size: 13px;
    }
  }

/* =========================================
   KEEN LAWN ORIGINAL DASHBOARD LAYOUT
   ========================================= */

}

}

.app-nav .nav-item.active {
  background: var(--navy-light);
  color: white;
}

.page-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 14px;
}

.page-heading h2 {
  margin: 0;
  font-size: 27px;
  font-weight: 800;
  letter-spacing: -0.5px;
}

.page-heading .add-client-button {
  width: auto;
  min-height: 44px;
  margin: 0;
  padding: 10px 16px;
  white-space: nowrap;
}

.metric-card {
  min-height: 128px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  background: white;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}

.metric-label {
  color: var(--muted);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.8px;
}

.metric-number {
  margin-top: 8px;
  color: var(--text);
  font-size: 36px;
  line-height: 1;
  font-weight: 800;
}

.card-heading-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.card-heading-row h2 {
  margin: 0;
}

.small-secondary {
  width: auto;
  min-height: 42px;
  margin: 0;
  padding: 9px 14px;
  background: var(--blue-soft);
  color: var(--blue-dark);
}

.dashboard-account {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 4px 30px;
  color: var(--muted);
  font-size: 13px;
}

.logout-button {
  width: auto;
  min-height: 40px;
  margin: 0;
  padding: 8px 13px;
  background: var(--blue-soft);
  color: var(--blue-dark);
}

/* Match the wider original Keen Lawn navigation */
@media (max-width: 520px) {
  .app-nav {
    margin:
      -16px
      -16px
      20px;
  }

  .metric-card {
    min-height: 128px;
    padding: 20px;
  }

  .page-heading h2 {
    font-size: 26px;
  }

  .page-heading .add-client-button {
    font-size: 14px;
    padding: 9px 13px;
  }
}
    
</style>
</head>

async function loadDashboardMetrics() {
  const activeElement =
    document.getElementById(
      "metricActiveClients"
    );

  const dueElement =
    document.getElementById(
      "metricDueSoon"
    );

  const unpaidElement =
    document.getElementById(
      "metricUnpaid"
    );

  const expenseElement =
    document.getElementById(
      "metricMonthExpenses"
    );

  const now = new Date();

  const localDateString = date => {
    return `${date.getFullYear()}-${String(
      date.getMonth() + 1
    ).padStart(2, "0")}-${String(
      date.getDate()
    ).padStart(2, "0")}`;
  };

  const today =
    localDateString(now);

  const sevenDaysFromNow =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate() + 7
    );

  const sevenDayDate =
    localDateString(sevenDaysFromNow);

  const monthStart =
    `${now.getFullYear()}-${String(
      now.getMonth() + 1
    ).padStart(2, "0")}-01`;

  const nextMonth =
    new Date(
      now.getFullYear(),
      now.getMonth() + 1,
      1
    );

  const nextMonthStart =
    localDateString(nextMonth);

  const [
    clientsResult,
    dueJobsResult,
    unpaidResult,
    expensesResult
  ] = await Promise.all([
    supabaseClient
      .from("clients")
      .select("id", {
        count: "exact",
        head: true
      })
      .eq("active", true),

    supabaseClient
      .from("jobs")
      .select("id", {
        count: "exact",
        head: true
      })
      .gte("scheduled_date", today)
      .lte(
        "scheduled_date",
        sevenDayDate
      )
      .neq("status", "Cancelled")
      .neq("status", "Complete"),

    supabaseClient
      .from("jobs")
      .select("price")
      .eq("status", "Complete")
      .eq(
        "payment_status",
        "Unpaid"
      ),

    supabaseClient
      .from("expenses")
      .select("amount")
      .gte(
        "expense_date",
        monthStart
      )
      .lt(
        "expense_date",
        nextMonthStart
      )
  ]);

  if (activeElement) {
    activeElement.textContent =
      clientsResult.error
        ? "—"
        : clientsResult.count ?? 0;
  }

  if (dueElement) {
    dueElement.textContent =
      dueJobsResult.error
        ? "—"
        : dueJobsResult.count ?? 0;
  }

  const unpaidTotal =
    (unpaidResult.data || [])
      .reduce(
        (total, job) =>
          total +
          Number(job.price || 0),
        0
      );

  if (unpaidElement) {
    unpaidElement.textContent =
      unpaidResult.error
        ? "—"
        : `$${unpaidTotal.toFixed(2)}`;
  }

  const monthExpenses =
    (expensesResult.data || [])
      .reduce(
        (total, expense) =>
          total +
          Number(expense.amount || 0),
        0
      );

  if (expenseElement) {
    expenseElement.textContent =
      expensesResult.error
        ? "—"
        : `$${monthExpenses.toFixed(2)}`;
  }

  if (clientsResult.error) {
    console.error(
      clientsResult.error
    );
  }

  if (dueJobsResult.error) {
    console.error(
      dueJobsResult.error
    );
  }

  if (unpaidResult.error) {
    console.error(
      unpaidResult.error
    );
  }

  if (expensesResult.error) {
    console.error(
      expensesResult.error
    );
  }
}
  
async function loadUpcomingJobs() {
  const list =
    document.getElementById("upcomingJobList");

  if (!list) return;

  const now = new Date();

const today =
  `${now.getFullYear()}-${String(
    now.getMonth() + 1
  ).padStart(2, "0")}-${String(
    now.getDate()
  ).padStart(2, "0")}`;

  const { data: jobs, error } =
    await supabaseClient
      .from("jobs")
      .select(`
        *,
        clients (
          first_name,
          last_name
        )
      `)
      .gte("scheduled_date", today)
      .neq("status", "Cancelled")
    .neq("status", "Complete")
      .order("scheduled_date", {
        ascending: true
      })
      .order("scheduled_time", {
        ascending: true
      })
      .limit(3);

  if (error) {
    console.error(error);

    list.innerHTML = `
      <p class="empty">
        Could not load upcoming jobs:
        ${escapeHtml(error.message)}
      </p>
    `;
    return;
  }

  if (!jobs || jobs.length === 0) {
    list.innerHTML = `
      <p class="empty">
        No upcoming jobs scheduled.
      </p>
    `;
    return;
  }

  list.innerHTML = jobs.map(job => {
    const clientName =
      `${job.clients?.first_name || ""}
       ${job.clients?.last_name || ""}`.trim()
      || "Client";

    const time =
      job.scheduled_time
        ? job.scheduled_time.slice(0, 5)
        : "No time";

    const price =
      job.price != null
        ? `$${Number(job.price).toFixed(2)}`
        : "No price";

    return `
      <div class="client"
        style="margin-bottom:12px;">

        <div class="client-name">
          ${escapeHtml(clientName)}
        </div>

        <div class="client-detail">
          ${escapeHtml(job.scheduled_date)}
          • ${escapeHtml(time)}
          • ${escapeHtml(price)}
          • ${escapeHtml(job.status)}
        </div>

        <button
          class="secondary"
          onclick="showEditJob(
            '${job.id}',
            '${job.client_id}'
          )"
          style="margin-top:10px;">
          Manage Job
        </button>

      </div>
    `;
  }).join("") + `
  <button
    class="secondary"
    onclick="showSchedule()"
    style="margin-top:16px;">
    View Full Schedule
  </button>
`;
}
  
async function loadBusinessSummary() {
  const summary =
    document.getElementById("businessSummary");

  if (!summary) return;

  const { data: jobs, error } =
    await supabaseClient
      .from("jobs")
      .select(
  "price, payment_status, status, scheduled_date"
);

  if (error) {
    console.error(error);

    summary.innerHTML = `
      <p class="empty">
        Could not load business summary:
        ${escapeHtml(error.message)}
      </p>
    `;
    return;
  }

  const allJobs = jobs || [];

  const totalRevenue = allJobs
    .filter(job => job.payment_status === "Paid")
    .reduce(
      (total, job) =>
        total + Number(job.price || 0),
      0
    );

  const unpaidRevenue = allJobs
  .filter(job =>
    job.payment_status === "Unpaid" &&
    job.status === "Complete"
  )
  .reduce(
    (total, job) =>
      total + Number(job.price || 0),
    0
  );
   
  
  const completedJobs =
    allJobs.filter(
      job => job.status === "Complete"
    ).length;

const { data: expenses, error: expenseError } =
  await supabaseClient
    .from("expenses")
    .select("amount, expense_date");

if (expenseError) {
  console.error(expenseError);
}

const totalExpenses =
  (expenses || []).reduce(
    (total, expense) =>
      total + Number(expense.amount || 0),
    0
  );

const netIncome =
  totalRevenue - totalExpenses;

const now = new Date();

const currentYear =
  now.getFullYear();

const currentMonth =
  now.getMonth() + 1;

const isCurrentMonth = dateValue => {
  if (!dateValue) return false;

  const [year, month] =
    dateValue.split("-").map(Number);

  return (
    year === currentYear &&
    month === currentMonth
  );
};

async function loadTodayJobs() {
  const list = document.getElementById("todayJobList");

  const today = new Date();
  const year = today.getFullYear();
  const month = String(today.getMonth() + 1).padStart(2, "0");
  const day = String(today.getDate()).padStart(2, "0");
  const todayString = `${year}-${month}-${day}`;

  const { data: jobs, error } =
    await supabaseClient
      .from("jobs")
      .select(`
        *,
        clients (
          first_name,
          last_name,
          address,
          state,
          zip_code
        )
      `)
      .eq("scheduled_date", todayString)
.neq("status", "Cancelled")
.order("scheduled_time", {
  ascending: true
});

  if (error) {
    console.error(error);

    list.innerHTML = `
      <p class="empty">

        ${escapeHtml(error.message)}
      </p>

    return;

  if (!jobs || jobs.length === 0) {
    list.innerHTML = `
      <p class="empty">
        No jobs scheduled for today.
      </p>
    `;

    return;
  }

  list.innerHTML = jobs.map(job => {
    const client = job.clients || {};

    const name =
      `${client.first_name || ""} ${client.last_name || ""}`.trim()
      || "Client";

    const time = job.scheduled_time
      ? job.scheduled_time.slice(0, 5)
      : "No time";

    const price = job.price != null
      ? `$${Number(job.price).toFixed(2)}`
      : "No price";

    const address = [
      client.address,
      client.state,
      client.zip_code
    ].filter(Boolean).join(", ");

    return `

        <div class="client-name">
          ${escapeHtml(name)}

        }

          class="secondary"
          onclick="showEditJob('${job.id}')"
          style="margin-top:10px;">
          Manage Job
        </button>
      </div>
    `;
  }).join("");
}

async function saveExpense() {
  const message =
    document.getElementById("expenseMessage");

  const expenseDate =
    document.getElementById("expenseDate").value;

  const category =
    document.getElementById("expenseCategory").value;

  const description =
    document.getElementById("expenseDescription")
      .value
      .trim();

  const amount =
    document.getElementById("expenseAmount").value;

  if (!expenseDate) {
    message.textContent =
      "Please select an expense date.";
    return;
  }

  if (!category) {
    message.textContent =
      "Please select a category.";
    return;
  }

  if (!amount || Number(amount) <= 0) {
    message.textContent =
      "Please enter a valid expense amount.";
    return;
  }

  message.textContent = "Saving expense...";

  const {
    data: { user },
    error: userError
  } = await supabaseClient.auth.getUser();

  if (userError || !user) {
    message.textContent =
      "Your login session could not be verified.";
    return;
  }

  const { error } =
    await supabaseClient
      .from("expenses")
      .insert({
        user_id: user.id,
        expense_date: expenseDate,
        category: category,
        description: description || null,
        amount: Number(amount)
      });

  if (error) {
    console.error(error);

    message.textContent =
      "Could not save expense: " +
      error.message;

    return;
  }

  document.getElementById(
    "expenseCategory"
  ).value = "";

  document.getElementById(
    "expenseDescription"
  ).value = "";

  document.getElementById(
    "expenseAmount"
  ).value = "";

  message.textContent = "Expense saved.";

  await loadExpenses();
}async function updateExpense(expenseId) {
  const message =
    document.getElementById(
      "editExpenseMessage"
    );

  const expenseDate =
    document.getElementById(
      "editExpenseDate"
    ).value;

  const category =
    document.getElementById(
      "editExpenseCategory"
    ).value;

  const description =
    document.getElementById(
      "editExpenseDescription"
    ).value.trim();

  const amount =
    document.getElementById(
      "editExpenseAmount"
    ).value;

  if (!expenseDate) {
    message.textContent =
      "Please select an expense date.";
    return;
  }

  if (!category) {
    message.textContent =
      "Please select a category.";
    return;
  }

  if (!amount || Number(amount) <= 0) {
    message.textContent =
      "Please enter a valid expense amount.";
    return;
  }

  message.textContent =
    "Saving changes...";

  const { error } =
    await supabaseClient
      .from("expenses")
      .update({
        expense_date: expenseDate,
        category: category,
        description:
          description || null,
        amount: Number(amount)
      })
      .eq("id", expenseId);

  if (error) {
    console.error(error);

    message.textContent =
      "Could not update expense: " +
      error.message;

    return;
  }

  await showExpenses();
}

async function compressPropertyPhoto(file) {
  const MAX_SIZE = 1600;
  const QUALITY = 0.8;

  return new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.onerror = () => {
      reject(
        new Error("Could not read photo.")
      );
    };

    reader.onload = event => {
      const image = new Image();

      image.onerror = () => {
        reject(
          new Error("Could not process photo.")
        );
      };

      image.onload = () => {
        let width = image.width;
        let height = image.height;

        if (
          width > MAX_SIZE ||
          height > MAX_SIZE
        ) {
          const scale =
            Math.min(
              MAX_SIZE / width,
              MAX_SIZE / height
            );

          width =
            Math.round(width * scale);

          height =
            Math.round(height * scale);
        }

        const canvas =
          document.createElement("canvas");

        canvas.width = width;
        canvas.height = height;

        const context =
          canvas.getContext("2d");

        context.drawImage(
          image,
          0,
          0,
          width,
          height
        );

        canvas.toBlob(
          blob => {
            if (!blob) {
              reject(
                new Error(
                  "Could not compress photo."
                )
              );
              return;
            }

            resolve(blob);
          },
          "image/jpeg",
          QUALITY
        );
      };

      image.src = event.target.result;
    };

    reader.readAsDataURL(file);
  });
}
  
async function uploadPropertyPhoto(clientId) {
  const fileInput =
    document.getElementById("propertyPhoto");

  const captionInput =
    document.getElementById("photoCaption");

  const message =
    document.getElementById("photoMessage");

  const file = fileInput.files[0];

  if (!file) {
    message.textContent =
      "Choose a photo first.";
    return;
  }

  message.textContent =
  "Optimizing photo...";

let optimizedPhoto;

try {
  optimizedPhoto =
    await compressPropertyPhoto(file);
} catch (error) {
  console.error(error);

  message.textContent =
    "Could not process photo: " +
    error.message;

  return;
}

message.textContent =
  "Uploading photo...";

const {
  data: { user },
  error: userError
} = await supabaseClient.auth.getUser();
  if (userError || !user) {
    message.textContent =
      "Your login session could not be verified.";
    return;
  }

  const fileName =
  `${Date.now()}-${crypto.randomUUID()}.jpg`;
  
  const storagePath =
    `${user.id}/${clientId}/${fileName}`;

  const { error: uploadError } =
    await supabaseClient.storage
      .from("property-photos")
      .upload(storagePath, optimizedPhoto, {
  contentType: "image/jpeg"
});

  if (uploadError) {
    console.error(uploadError);
    message.textContent =
      "Could not upload photo: " +
      uploadError.message;
    return;
  }

  const { error: databaseError } =
    await supabaseClient
      .from("property_photos")
      .insert({
        user_id: user.id,
        client_id: clientId,
        photo_url: storagePath,
        caption:
          captionInput.value.trim() || null
      });

  if (databaseError) {
    console.error(databaseError);

    // Don't leave an orphaned file behind.
    await supabaseClient.storage
      .from("property-photos")
      .remove([storagePath]);

    message.textContent =
      "Photo uploaded, but could not save its record: " +
      databaseError.message;

    return;
  }

  fileInput.value = "";
  captionInput.value = "";

  message.textContent = "Photo saved.";

  await loadPropertyPhotos(clientId);
}

async function deletePropertyPhoto(
  photoId,
  clientId,
  photoPath
) {
  const confirmed = confirm(
    "Permanently delete this property photo? This cannot be undone."
  );

  if (!confirmed) return;

  const { error: storageError } =
    await supabaseClient.storage
      .from("property-photos")
      .remove([photoPath]);

  if (storageError) {
    console.error(storageError);

    alert(
      "Could not delete photo: " +
      storageError.message
    );

    return;
  }

  const { error: databaseError } =
    await supabaseClient
      .from("property_photos")
      .delete()
      .eq("id", photoId);

  if (databaseError) {
    console.error(databaseError);

    alert(
      "Photo was removed from storage, but its record could not be deleted: " +
      databaseError.message
    );

    return;
  }

  await loadPropertyPhotos(clientId);
}

function getMonthlyServiceDate(
  originalDate,
  monthsToAdd
) {
  const originalYear =
    originalDate.getFullYear();

  const originalMonth =
    originalDate.getMonth();

  const originalDay =
    originalDate.getDate();

  const targetMonthDate =
    new Date(
      originalYear,
      originalMonth + monthsToAdd,
      1,
      12
    );

  const targetYear =
    targetMonthDate.getFullYear();

  const targetMonth =
    targetMonthDate.getMonth();

  const lastDayOfTargetMonth =
    new Date(
      targetYear,
      targetMonth + 1,
      0,
      12
    ).getDate();

  const safeDay =
    Math.min(
      originalDay,
      lastDayOfTargetMonth
    );

  return new Date(
    targetYear,
    targetMonth,
    safeDay,
    12
  );
}

async function saveJob(clientId) {
  const message =
    document.getElementById("jobMessage");

  const scheduledDate =
    document.getElementById("jobDate").value;

  const scheduledTime =
    document.getElementById("jobTime").value;

  const price =
    document.getElementById("jobPrice").value;

  const status =
    document.getElementById("jobStatus").value;

  const paymentStatus =
    document.getElementById("jobPaymentStatus").value;

  const recurrence =
  document.getElementById("jobRecurrence").value;
  
  const notes =
    document.getElementById("jobNotes").value.trim();

  if (!scheduledDate) {
    message.textContent =
      "Please select a service date.";
    return;
  }

  message.textContent = "Saving job...";

  const {
    data: { user }
  } = await supabaseClient.auth.getUser();

  if (!user) {
    message.textContent =
      "You must be logged in.";
    return;
  }

  const jobsToCreate = [];

const recurrenceId =
  recurrence !== "none"
    ? crypto.randomUUID()
    : null;
  
const firstDate =
  new Date(`${scheduledDate}T12:00:00`);

let totalJobs = 1;

if (recurrence === "weekly") {
  totalJobs = 12;
}

if (recurrence === "biweekly") {
  totalJobs = 8;
}

if (recurrence === "monthly") {
  totalJobs = 6;
}

for (let i = 0; i < totalJobs; i++) {
  let jobDate = new Date(firstDate);

  if (recurrence === "weekly") {
    jobDate.setDate(
      firstDate.getDate() + (i * 7)
    );
  }

  if (recurrence === "biweekly") {
    jobDate.setDate(
      firstDate.getDate() + (i * 14)
    );
  }

  if (recurrence === "monthly") {
    jobDate =
      getMonthlyServiceDate(
        firstDate,
        i
      );
  }
  const formattedDate =
  `${jobDate.getFullYear()}-${String(
    jobDate.getMonth() + 1
  ).padStart(2, "0")}-${String(
    jobDate.getDate()
  ).padStart(2, "0")}`;

  jobsToCreate.push({
    user_id: user.id,
    client_id: clientId,
    recurrence_id: recurrenceId,
recurrence_type:
  recurrence !== "none"
    ? recurrence
    : null,
recurrence_end_date: null,
    scheduled_date: formattedDate,
    scheduled_time: scheduledTime || null,
    status: status,
    price: price ? Number(price) : null,
    payment_status: paymentStatus,
    notes: notes || null
  });
}

const { error } =
  await supabaseClient
    .from("jobs")
    .insert(jobsToCreate);

  if (error) {
    console.error(error);
    message.textContent =
      `Could not save job: ${error.message}`;
    return;
  }

  message.textContent = "Job saved.";

  await showClientProfile(clientId);
}

async function updateJob(jobId, clientId) {
  const message =
    document.getElementById("editJobMessage");

  const scheduledDate =
    document.getElementById("editJobDate").value;

  const scheduledTime =
    document.getElementById("editJobTime").value;

  const price =
    document.getElementById("editJobPrice").value;

  const status =
    document.getElementById("editJobStatus").value;

  const paymentStatus =
    document.getElementById(
      "editJobPaymentStatus"
    ).value;

  const notes =
    document.getElementById("editJobNotes")
      .value
      .trim();

const scopeElement =
  document.getElementById("editJobScope");

const scope =
  scopeElement
    ? scopeElement.value
    : "single";
  
  if (!scheduledDate) {
    message.textContent =
      "Please select a service date.";
    return;
  }

  message.textContent = "Saving changes...";

  const updates = {
    scheduled_date: scheduledDate,
    scheduled_time: scheduledTime || null,
    price: price ? Number(price) : null,
    status: status,
    payment_status: paymentStatus,
    notes: notes || null
  };

  if (status === "Complete") {
    updates.completed_at =
      new Date().toISOString();
  } else {
    updates.completed_at = null;
  }

  let error;

if (scope === "future") {
  const { data: currentJob, error: jobError } =
    await supabaseClient
      .from("jobs")
      .select("recurrence_id, scheduled_date")
      .eq("id", jobId)
      .single();

const originalDate =
  currentJob?.scheduled_date;

const dateChanged =
  originalDate &&
  scheduledDate !== originalDate;
  
  if (jobError || !currentJob?.recurrence_id) {
    error =
      jobError ||
      new Error("Recurring series could not be found.");
  } else {
    const { data: futureJobs, error: futureJobsError } =
  await supabaseClient
    .from("jobs")
    .select("id, scheduled_date")
    .eq("recurrence_id", currentJob.recurrence_id)
    .gte(
      "scheduled_date",
      currentJob.scheduled_date
    )
    .order("scheduled_date", {
      ascending: true
    });

if (futureJobsError) {
  error = futureJobsError;
} else {
  const original =
    new Date(`${originalDate}T12:00:00`);

  const changed =
    new Date(`${scheduledDate}T12:00:00`);

  const dayDifference =
    Math.round(
      (changed - original) /
      (1000 * 60 * 60 * 24)
    );

  for (const futureJob of futureJobs) {
    const oldDate =
      new Date(
        `${futureJob.scheduled_date}T12:00:00`
      );

    if (dateChanged) {
      oldDate.setDate(
        oldDate.getDate() + dayDifference
      );
    }

    const newDate =
  `${oldDate.getFullYear()}-${String(
    oldDate.getMonth() + 1
  ).padStart(2, "0")}-${String(
    oldDate.getDate()
  ).padStart(2, "0")}`;

    const isCurrentJob =
  futureJob.id === jobId;

const futureUpdates = {
  scheduled_date: newDate,
  scheduled_time: updates.scheduled_time,
  price: updates.price,
  notes: updates.notes
};

if (isCurrentJob) {
  futureUpdates.status = updates.status;
  futureUpdates.payment_status =
    updates.payment_status;
  futureUpdates.completed_at =
    updates.completed_at;
}

const result =
  await supabaseClient
    .from("jobs")
    .update(futureUpdates)
    .eq("id", futureJob.id);
    if (result.error) {
      error = result.error;
      break;
    }
  }
}
  }
} else {
  const result =
    await supabaseClient
      .from("jobs")
      .update(updates)
      .eq("id", jobId);

  error = result.error;
}

  if (error) {
    console.error(error);

    message.textContent =
      `Could not update job: ${error.message}`;

    return;
  }

  message.textContent = "Job updated.";

  await showClientProfile(clientId);
}

async function cancelFutureJobs(jobId, clientId) {
  const confirmed = confirm(
    "Cancel this service and all future visits in this recurring series?"
  );

  if (!confirmed) return;

  const { data: currentJob, error: jobError } =
    await supabaseClient
      .from("jobs")
      .select("recurrence_id, scheduled_date")
      .eq("id", jobId)
      .single();

  if (jobError || !currentJob?.recurrence_id) {
    alert(
      "Could not find the recurring service."
    );
    return;
  }

  const { error } =
    await supabaseClient
      .from("jobs")
      .update({
        status: "Cancelled"
      })
      .eq(
        "recurrence_id",
        currentJob.recurrence_id
      )
      .gte(
        "scheduled_date",
        currentJob.scheduled_date
      );

  if (error) {
    alert(
      "Could not cancel future service: " +
      error.message
    );
    return;
  }

  await showClientProfile(clientId);
}

async function deleteClientPermanently(clientId) {
  const firstConfirmation = confirm(
    "Permanently delete this client and all of their jobs and property photos? This cannot be undone."
  );

  if (!firstConfirmation) return;

  const secondConfirmation = confirm(
    "Are you sure? All records for this client will be permanently deleted."
  );

  if (!secondConfirmation) return;

  // Get the client's photo records first
  // so the actual files can also be removed
  // from Supabase Storage.
  const {
    data: photos,
    error: photoLoadError
  } = await supabaseClient
    .from("property_photos")
    .select("photo_url")
    .eq("client_id", clientId);

  if (photoLoadError) {
    console.error(photoLoadError);

    alert(
      "Could not verify the client's photos. Nothing was deleted."
    );

    return;
  }

  // Remove property photos from Storage.
  if (photos && photos.length > 0) {
    const photoPaths =
      photos
        .map(photo => photo.photo_url)
        .filter(Boolean);

    if (photoPaths.length > 0) {
      const { error: storageError } =
        await supabaseClient.storage
          .from("property-photos")
          .remove(photoPaths);

      if (storageError) {
        console.error(storageError);

        alert(
          "Could not delete the client's stored photos. Client deletion was stopped."
        );

        return;
      }
    }
  }

  // Delete property photo database records.
  const { error: photoDeleteError } =
    await supabaseClient
      .from("property_photos")
      .delete()
      .eq("client_id", clientId);

  if (photoDeleteError) {
    console.error(photoDeleteError);

    alert(
      "Could not delete the client's photo records. Client deletion was stopped."
    );

    return;
  }

  // Delete every job belonging to this client.
  const { error: jobDeleteError } =
    await supabaseClient
      .from("jobs")
      .delete()
      .eq("client_id", clientId);

  if (jobDeleteError) {
    console.error(jobDeleteError);

    alert(
      "Could not delete the client's jobs. Client deletion was stopped."
    );

    return;
  }

  // Finally delete the client.
  const { error: clientDeleteError } =
    await supabaseClient
      .from("clients")
      .delete()
      .eq("id", clientId);

  if (clientDeleteError) {
    console.error(clientDeleteError);

    alert(
      "The client's related records were removed, but the client could not be deleted: " +
      clientDeleteError.message
    );

    return;
  }

  alert("Client permanently deleted.");

  await goToDashboard();
}

        </option>
        <option value="Average"
          ${client.yard_difficulty === "Average" ? "selected" : ""}>
          Average
        </option>
        <option value="Difficult"
          ${client.yard_difficulty === "Difficult" ? "selected" : ""}>
          Difficult
        </option>
      </select>

      <label>Preferred Service Day</label>
      <select id="editPreferredDay">
        ${buildDayOptions(client.preferred_day)}
      </select>

      <label>Service Frequency</label>
      <select id="editFrequency">
        ${buildFrequencyOptions(client.frequency)}
      </select>

      <label>Default Price</label>
      <input id="editDefaultPrice"
        type="number"
        step="0.01"
        min="0"
        value="${escapeHtml(client.default_price ?? "")}">

      <label>Gate Code</label>
      <input id="editGateCode"
        value="${escapeHtml(client.gate_code || "")}">

      <label>Pets / Yard Notes</label>
      <input id="editPets"
        value="${escapeHtml(client.pets || "")}">

      <label>Notes</label>
      <textarea id="editNotes">${escapeHtml(client.notes || "")}</textarea>

      <button onclick="updateClient('${client.id}')">
        Save Changes
      </button>

      <button class="secondary"
        onclick="showClientProfile('${client.id}')">
        Cancel
      </button>

      <div id="editMessage" class="message"></div>
    </div>
  `;
}


async function updateClient(clientId) {
  const message =
    document.getElementById("editMessage");

  const firstName =
    document.getElementById("editFirstName").value.trim();

  const lastName =
    document.getElementById("editLastName").value.trim();

  if (!firstName || !lastName) {
    message.textContent =
      "First and last name are required.";
    return;
  }

  message.textContent = "Saving changes...";

  const acreage =
    document.getElementById("editAcreage").value;

  const price =
    document.getElementById("editDefaultPrice").value;

  const updates = {
    first_name: firstName,
    last_name: lastName,
    phone:
      document.getElementById("editPhone").value.trim() || null,
    email:
      document.getElementById("editEmail").value.trim() || null,
    address:
      document.getElementById("editAddress").value.trim() || null,
    state:
      document.getElementById("editState").value.trim() || null,
    zip_code:
      document.getElementById("editZipCode").value.trim() || null,
    acreage: acreage ? Number(acreage) : null,
    yard_difficulty:
      document.getElementById("editYardDifficulty").value || null,
    preferred_day:
      document.getElementById("editPreferredDay").value || null,
    frequency:
      document.getElementById("editFrequency").value || null,
    default_price: price ? Number(price) : null,
    gate_code:
      document.getElementById("editGateCode").value.trim() || null,
    pets:
      document.getElementById("editPets").value.trim() || null,
    notes:
      document.getElementById("editNotes").value.trim() || null
  };

  const { error } =
    await supabaseClient
      .from("clients")
      .update(updates)
      .eq("id", clientId);

  if (error) {
    console.error(error);
    message.textContent =
      "Could not update client: " + error.message;
    return;
  }

  message.textContent = "Changes saved.";

  setTimeout(() => {
    showClientProfile(clientId);
  }, 400);
}


function buildDayOptions(current) {
  const days = [
    "",
    "Monday",
    "Tuesday",
    "Wednesday",
    "Thursday",
    "Friday",
    "Saturday",
    "Sunday"
  ];

  return days.map(day => {
    const label = day || "No preference";
    const selected = day === current ? "selected" : "";

    return `<option value="${day}" ${selected}>
      ${label}
    </option>`;
  }).join("");
}


function buildFrequencyOptions(current) {
  const frequencies = [
    "",
    "Weekly",
    "Biweekly",
    "Monthly",
    "One Time"
  ];

  return frequencies.map(frequency => {
    const label = frequency || "Select";
    const selected =
      frequency === current ? "selected" : "";

    return `<option value="${frequency}" ${selected}>
      ${label}
    </option>`;
  }).join("");
}

async function showInactiveClients() {
  app.innerHTML = `
    <div class="card">
      <h2>Inactive Clients</h2>

      <div id="inactiveClientList">
        <p class="empty">Loading inactive clients...</p>
      </div>

      <button
        class="secondary"
        onclick="showClientsPage()">
        Back to Active Clients
      </button>
    </div>
  `;

  const { data, error } =
    await supabaseClient
      .from("clients")
      .select("*")
      .eq("active", false)
      .order("last_name", {
        ascending: true
      });

  const list =
    document.getElementById("inactiveClientList");

  if (error) {
    list.innerHTML = `
      <p class="empty">
        Could not load inactive clients:
        ${escapeHtml(error.message)}
      </p>
    `;
    return;
  }

  if (!data || data.length === 0) {
    list.innerHTML = `
      <p class="empty">
        No inactive clients.
      </p>
    `;
    return;
  }

  list.innerHTML = data.map(client => {
    const name =
      `${client.first_name || ""} ${client.last_name || ""}`.trim();

    return `
      <div class="client">
        <div class="client-name">
          ${escapeHtml(name)}
        </div>

        <div class="client-detail">
          ${escapeHtml(client.phone || "No phone number")}
        </div>

        <button
          onclick="reactivateClient('${client.id}')">
          Reactivate Client
        </button>
      </div>
    `;
  }).join("");
}


async function reactivateClient(clientId) {
  const { error } =
    await supabaseClient
      .from("clients")
      .update({ active: true })
      .eq("id", clientId);

  if (error) {
    alert(
      "Could not reactivate client: " +
      error.message
    );
    return;
  }

  await showInactiveClients();
}
  
  async function returnToDashboard() {
    const {
      data: { user }
    } = await supabaseClient.auth.getUser();

    if (user) {
      showDashboard(user);
    } else {
      showLogin();
    }
  }

  function showError(message) {
    app.innerHTML = `
      <div class="card">
        <h2>Connection Error</h2>
        <p>${escapeHtml(message)}</p>
      </div>
    `;
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  startApp();
</script>
