async function loadUpcomingJobs() {
  const list =
    document.getElementById("upcomingJobList");

  if (!list) return;

  const today =
    new Date().toISOString().split("T")[0];

  const { data: jobs, error } =
    await supabaseClient
      .from("jobs")
      .select(`
        *,
        clients (
          first_name,
          last_name
        )
      `)
      .gte("scheduled_date", today)
      .neq("status", "Cancelled")
    .neq("status", "Complete")
      .order("scheduled_date", {
        ascending: true
      })
      .order("scheduled_time", {
        ascending: true
      })
      .limit(3);

  if (error) {
    console.error(error);

    list.innerHTML = `
      <p class="empty">
        Could not load upcoming jobs:
        ${escapeHtml(error.message)}
      </p>
    `;
    return;
  }

  if (!jobs || jobs.length === 0) {
    list.innerHTML = `
      <p class="empty">
        No upcoming jobs scheduled.
      </p>
    `;
    return;
  }

  list.innerHTML = jobs.map(job => {
    const clientName =
      `${job.clients?.first_name || ""}
       ${job.clients?.last_name || ""}`.trim()
      || "Client";

    const time =
      job.scheduled_time
        ? job.scheduled_time.slice(0, 5)
        : "No time";

    const price =
      job.price != null
        ? `$${Number(job.price).toFixed(2)}`
        : "No price";

    return `
      <div class="client"
        style="margin-bottom:12px;">

        <div class="client-name">
          ${escapeHtml(clientName)}
        </div>

        <div class="client-detail">
          ${escapeHtml(job.scheduled_date)}
          • ${escapeHtml(time)}
          • ${escapeHtml(price)}
          • ${escapeHtml(job.status)}
        </div>

        <button
          class="secondary"
          onclick="showEditJob(
            '${job.id}',
            '${job.client_id}'
          )"
          style="margin-top:10px;">
          Manage Job
        </button>

      </div>
    `;
  }).join("") + `
  <button
    class="secondary"
    onclick="showSchedule()"
    style="margin-top:16px;">
    View Full Schedule
  </button>
`;
}
  
async function loadBusinessSummary() {
  const summary =
    document.getElementById("businessSummary");

  if (!summary) return;

  const { data: jobs, error } =
    await supabaseClient
      .from("jobs")
      .select(
  "price, payment_status, status, scheduled_date"
);

  if (error) {
    console.error(error);

    summary.innerHTML = `
      <p class="empty">
        Could not load business summary:
        ${escapeHtml(error.message)}
      </p>
    `;
    return;
  }

  const allJobs = jobs || [];

  const totalRevenue = allJobs
    .filter(job => job.payment_status === "Paid")
    .reduce(
      (total, job) =>
        total + Number(job.price || 0),
      0
    );

  const unpaidRevenue = allJobs
    .filter(job =>
      job.payment_status === "Unpaid" &&
      job.status !== "Cancelled"
    )
    .reduce(
      (total, job) =>
        total + Number(job.price || 0),
      0
    );

  const completedJobs =
    allJobs.filter(
      job => job.status === "Complete"
    ).length;

const { data: expenses, error: expenseError } =
  await supabaseClient
    .from("expenses")
    .select("amount, expense_date");

if (expenseError) {
  console.error(expenseError);
}

const totalExpenses =
  (expenses || []).reduce(
    (total, expense) =>
      total + Number(expense.amount || 0),
    0
  );

const netIncome =
  totalRevenue - totalExpenses;

const now = new Date();

const currentYear =
  now.getFullYear();

const currentMonth =
  now.getMonth() + 1;

const isCurrentMonth = dateValue => {
  if (!dateValue) return false;

  const [year, month] =
    dateValue.split("-").map(Number);

  return (
    year === currentYear &&
    month === currentMonth
  );
};

const monthlyRevenue = allJobs
  .filter(job =>
    job.payment_status === "Paid" &&
    isCurrentMonth(job.scheduled_date)
  )
  .reduce(
    (total, job) =>
      total + Number(job.price || 0),
    0
  );

const monthlyExpenses =
  (expenses || [])
    .filter(expense =>
      isCurrentMonth(expense.expense_date)
    )
    .reduce(
      (total, expense) =>
        total + Number(expense.amount || 0),
      0
    );

const monthlyNetIncome =
  monthlyRevenue - monthlyExpenses;
  
  summary.innerHTML = `
  <div style="
  margin-bottom:14px;
  padding-bottom:14px;
  border-bottom:1px solid #e4e9e6;
">

    Revenue:

</div>

</div>

<div class="client-detail">

<div class="client-detail">

async function loadTodayJobs() {
  const list = document.getElementById("todayJobList");

  if (!list) return;

  const today = new Date();
  const year = today.getFullYear();
  const month = String(today.getMonth() + 1).padStart(2, "0");
  const day = String(today.getDate()).padStart(2, "0");
  const todayString = `${year}-${month}-${day}`;

  const { data: jobs, error } =
    await supabaseClient
      .from("jobs")
      .select(`
        *,
        clients (
          first_name,
          last_name,
          address,
          state,
          zip_code
        )
      `)
      .eq("scheduled_date", todayString)
.neq("status", "Cancelled")
.order("scheduled_time", {
  ascending: true
});

  if (error) {
    console.error(error);

    list.innerHTML = `
      <p class="empty">
        Could not load today's jobs:
        ${escapeHtml(error.message)}
      </p>
    `;

    return;
  }

  if (!jobs || jobs.length === 0) {
    list.innerHTML = `
      <p class="empty">
        No jobs scheduled for today.
      </p>
    `;

    return;
  }

  list.innerHTML = jobs.map(job => {
    const client = job.clients || {};

    const name =
      `${client.first_name || ""} ${client.last_name || ""}`.trim()
      || "Client";

    const time = job.scheduled_time
      ? job.scheduled_time.slice(0, 5)
      : "No time";

    const price = job.price != null
      ? `$${Number(job.price).toFixed(2)}`
      : "No price";

    const address = [
      client.address,
      client.state,
      client.zip_code
    ].filter(Boolean).join(", ");

    return `
      <div class="client" style="margin-bottom:12px;">
        <div class="client-name">
          ${escapeHtml(name)}
        </div>

        <div class="client-detail">
          ${escapeHtml(time)}
          • ${escapeHtml(price)}
          • ${escapeHtml(job.status || "Scheduled")}
        </div>

        ${
          address
            ? `<div class="client-detail">
                 ${escapeHtml(address)}
               </div>`
            : ""
        }

        <button
          class="secondary"
          onclick="showEditJob('${job.id}')"
          style="margin-top:10px;">
          Manage Job
        </button>
      </div>
    `;
  }).join("");
}

async function saveExpense() {
  const message =
    document.getElementById("expenseMessage");

  const expenseDate =
    document.getElementById("expenseDate").value;

  const category =
    document.getElementById("expenseCategory").value;

  const description =
    document.getElementById("expenseDescription")
      .value
      .trim();

  const amount =
    document.getElementById("expenseAmount").value;

  if (!expenseDate) {
    message.textContent =
      "Please select an expense date.";
    return;
  }

  if (!category) {
    message.textContent =
      "Please select a category.";
    return;
  }

  if (!amount || Number(amount) <= 0) {
    message.textContent =
      "Please enter a valid expense amount.";
    return;
  }

  message.textContent = "Saving expense...";

  const {
    data: { user },
    error: userError
  } = await supabaseClient.auth.getUser();

  if (userError || !user) {
    message.textContent =
      "Your login session could not be verified.";
    return;
  }

  const { error } =
    await supabaseClient
      .from("expenses")
      .insert({
        user_id: user.id,
        expense_date: expenseDate,
        category: category,
        description: description || null,
        amount: Number(amount)
      });

  if (error) {
    console.error(error);

    message.textContent =
      "Could not save expense: " +
      error.message;

    return;
  }

  document.getElementById(
    "expenseCategory"
  ).value = "";

  document.getElementById(
    "expenseDescription"
  ).value = "";

  document.getElementById(
    "expenseAmount"
  ).value = "";

  message.textContent = "Expense saved.";

  await loadExpenses();
}async function updateExpense(expenseId) {
  const message =
    document.getElementById(
      "editExpenseMessage"
    );

  const expenseDate =
    document.getElementById(
      "editExpenseDate"
    ).value;

  const category =
    document.getElementById(
      "editExpenseCategory"
    ).value;

  const description =
    document.getElementById(
      "editExpenseDescription"
    ).value.trim();

  const amount =
    document.getElementById(
      "editExpenseAmount"
    ).value;

  if (!expenseDate) {
    message.textContent =
      "Please select an expense date.";
    return;
  }

  if (!category) {
    message.textContent =
      "Please select a category.";
    return;
  }

  if (!amount || Number(amount) <= 0) {
    message.textContent =
      "Please enter a valid expense amount.";
    return;
  }

  message.textContent =
    "Saving changes...";

  const { error } =
    await supabaseClient
      .from("expenses")
      .update({
        expense_date: expenseDate,
        category: category,
        description:
          description || null,
        amount: Number(amount)
      })
      .eq("id", expenseId);

  if (error) {
    console.error(error);

    message.textContent =
      "Could not update expense: " +
      error.message;

    return;
  }

  await showExpenses();
}

  const confirmed = confirm(
    "Permanently delete this expense? This cannot be undone."
  );

  if (!confirmed) return;

  const { error } =
    await supabaseClient
      .from("expenses")
      .delete()
      .eq("id", expenseId);

  if (error) {
    console.error(error);

    alert(
      "Could not delete expense: " +
      error.message
    );

    return;
  }

  await showExpenses();
}

  async function saveClient() {
    const message =
      document.getElementById("saveMessage");

    const firstName =
      document.getElementById("firstName")
        .value.trim();

    const lastName =
      document.getElementById("lastName")
        .value.trim();

    if (!firstName || !lastName) {
      message.textContent =
        "First and last name are required.";
      return;
    }

    message.textContent = "Saving client...";

    const {
      data: { user },
      error: userError
    } = await supabaseClient.auth.getUser();

    if (userError || !user) {
      message.textContent =
        "Your login session could not be verified.";
      return;
    }

    const acreageValue =
      document.getElementById("acreage").value;

    const priceValue =
      document.getElementById("defaultPrice").value;

    const client = {
      user_id: user.id,
      first_name: firstName,
      last_name: lastName,
      phone:
        document.getElementById("phone")
          .value.trim() || null,
      email:
        document.getElementById("clientEmail")
          .value.trim() || null,
      address:
        document.getElementById("address")
          .value.trim() || null,
      state:
        document.getElementById("state")
          .value.trim() || null,
      zip_code:
        document.getElementById("zipCode")
          .value.trim() || null,
      acreage:
        acreageValue ?
          Number(acreageValue) : null,
      yard_difficulty:
        document.getElementById("yardDifficulty")
          .value || null,
      preferred_day:
        document.getElementById("preferredDay")
          .value || null,
      frequency:
        document.getElementById("frequency")
          .value || null,
      default_price:
        priceValue ?
          Number(priceValue) : null,
      gate_code:
        document.getElementById("gateCode")
          .value.trim() || null,
      pets:
        document.getElementById("pets")
          .value.trim() || null,
      notes:
        document.getElementById("notes")
          .value.trim() || null,
      active: true
    };

    const { error } =
      await supabaseClient
        .from("clients")
        .insert(client);

    if (error) {
      console.error(error);
      message.textContent =
        "Could not save client: " +
        error.message;
      return;
    }

    message.textContent = "Client saved.";

    setTimeout(() => {
      showDashboard(user);
    }, 500);
  }

  async function loadClients() {

        .from("clients")
        .select("*")
        .eq("active", true)

  async function showSchedule() {
  app.innerHTML = `
    <div class="card">
      <h2>Schedule</h2>
      <p>Loading route plan...</p>
    </div>
  `;

  const today = new Date();

  const todayString =
    `${today.getFullYear()}-${String(
      today.getMonth() + 1
    ).padStart(2, "0")}-${String(
      today.getDate()
    ).padStart(2, "0")}`;

  const { data: jobs, error } =
    await supabaseClient
      .from("jobs")
      .select(`
        *,
        clients (
          first_name,
          last_name,
          address,
          state,
          zip_code,
          phone
        )
      `)
      .gte("scheduled_date", todayString)
      .neq("status", "Cancelled")
    .neq("status", "Complete")
      .order("scheduled_date", {
        ascending: true
      })
      .order("scheduled_time", {
        ascending: true
      });

  if (error) {
    app.innerHTML = `
      <div class="card">
        <h2>Schedule</h2>

        <p>
          Could not load schedule:
          ${escapeHtml(error.message)}
        </p>

        <button
          class="secondary"
          onclick="returnToDashboard()">
          Back to Dashboard
        </button>
      </div>
    `;
    return;
  }

  const jobsByDate = {};

  (jobs || []).forEach(job => {
    if (!jobsByDate[job.scheduled_date]) {
      jobsByDate[job.scheduled_date] = [];
    }

    jobsByDate[job.scheduled_date].push(job);
  });

  const dates =
    Object.keys(jobsByDate).sort();

  let scheduleHtml = "";

  if (dates.length === 0) {
    scheduleHtml = `
      <div class="card">
        <p class="empty">
          No upcoming jobs scheduled.
        </p>
      </div>
    `;
  } else {
    scheduleHtml = dates.map(date => {
      const dayJobs = jobsByDate[date];
dayJobs.sort((a, b) => {
  const clientA = a.clients || {};
  const clientB = b.clients || {};

  // Jobs with an assigned time stay in time order.
  const timeA = a.scheduled_time || "";
  const timeB = b.scheduled_time || "";

  if (timeA && timeB && timeA !== timeB) {
    return timeA.localeCompare(timeB);
  }

  // If only one job has a scheduled time,
  // keep that appointment ahead of flexible jobs.
  if (timeA && !timeB) return -1;
  if (!timeA && timeB) return 1;

  // Flexible jobs are grouped by ZIP code.
  const zipA = clientA.zip_code || "";
  const zipB = clientB.zip_code || "";

  if (zipA !== zipB) {
    return zipA.localeCompare(zipB);
  }

  // Within the same ZIP code, group by address.
  const addressA = clientA.address || "";
  const addressB = clientB.address || "";

  return addressA.localeCompare(addressB);
});
      const dayRevenue =
        dayJobs.reduce(
          (total, job) =>
            total + Number(job.price || 0),
          0
        );

      const displayDate =
        new Date(`${date}T12:00:00`)
          .toLocaleDateString(
            undefined,
            {
              weekday: "long",
              month: "long",
              day: "numeric",
              year: "numeric"
            }
          );

      const routeAddresses =
  dayJobs
    .map(job => {
      const client = job.clients || {};

      return [
        client.address,
        client.state,
        client.zip_code
      ].filter(Boolean).join(", ");
    })
    .filter(Boolean);

const fullRouteUrl =
  routeAddresses.length > 0
    ? `https://www.google.com/maps/dir/?api=1&destination=${
        encodeURIComponent(
          routeAddresses[
            routeAddresses.length - 1
          ]
        )
      }${
        routeAddresses.length > 1
          ? `&waypoints=${
              routeAddresses
                .slice(0, -1)
                .map(address =>
                  encodeURIComponent(address)
                )
                .join("%7C")
            }`
          : ""
      }`
    : "";
      const stops = dayJobs.map(
        (job, index) => {
          const client = job.clients || {};

          const clientName =
            `${client.first_name || ""}
             ${client.last_name || ""}`.trim()
            || "Unknown Client";

          const time =
            job.scheduled_time
              ? job.scheduled_time.slice(0, 5)
              : "No time";

          const price =
            job.price != null
              ? `$${Number(job.price).toFixed(2)}`
              : "No price";

          const address = [
            client.address,
            client.state,
            client.zip_code
          ].filter(Boolean).join(", ");

          const directionsUrl =
            address
              ? `https://www.google.com/maps/dir/?api=1&destination=${
                  encodeURIComponent(address)
                }`
              : "";

          return `
            <div class="client">

              <div class="client-name">
                Stop ${index + 1} —
                ${escapeHtml(clientName)}
              </div>

              <div class="client-detail">
                ${escapeHtml(time)}
                • ${escapeHtml(price)}
                • ${escapeHtml(
                  job.status || "Scheduled"
                )}
              </div>

              ${
                address
                  ? `
                    <div class="client-detail">
                      ${escapeHtml(address)}
                    </div>

                    <button
                      class="secondary"
                      onclick="window.open(
                        '${directionsUrl}',
                        '_blank'
                      )">
                      Directions
                    </button>
                  `
                  : `
                    <div class="client-detail">
                      No address saved
                    </div>
                  `
              }

              <button
                class="secondary"
                onclick="showEditJob(
                  '${job.id}',
                  '${job.client_id}'
                )">
                Manage Job
              </button>

            </div>
          `;
        }
      ).join("");

      return `
        <div class="card">

          <h2>
            ${escapeHtml(displayDate)}
          </h2>

          <div class="client-detail"
            style="
              margin-bottom:14px;
              font-size:15px;
            ">
            <strong>
              ${dayJobs.length}
              ${dayJobs.length === 1
                ? "Stop"
                : "Stops"}
            </strong>
            • Expected Revenue:
            <strong>
              $${dayRevenue.toFixed(2)}
            </strong>
          </div>

          ${
  fullRouteUrl
    ? `
      <button
        onclick="window.open(
          '${fullRouteUrl}',
          '_blank'
        )"
        style="margin-bottom:14px;">
        Start Day Route
      </button>
    `
    : ""
}

${stops}

        </div>
      `;
    }).join("");
  }

  app.innerHTML = `
    <div class="dashboard-top">
      <div>
        <strong>Keen Lawn Route Planner</strong>
      </div>

      <button
        class="secondary"
        onclick="returnToDashboard()">
        Dashboard
      </button>
    </div>

    ${scheduleHtml}
  `;
}

async function uploadPropertyPhoto(clientId) {
  const fileInput =
    document.getElementById("propertyPhoto");

  const captionInput =
    document.getElementById("photoCaption");

  const message =
    document.getElementById("photoMessage");

  const file = fileInput.files[0];

  if (!file) {
    message.textContent =
      "Choose a photo first.";
    return;
  }

  message.textContent = "Uploading photo...";

  const {
    data: { user },
    error: userError
  } = await supabaseClient.auth.getUser();

  if (userError || !user) {
    message.textContent =
      "Your login session could not be verified.";
    return;
  }

  const extension =
    file.name.split(".").pop() || "jpg";

  const fileName =
    `${Date.now()}-${crypto.randomUUID()}.${extension}`;

  const storagePath =
    `${user.id}/${clientId}/${fileName}`;

  const { error: uploadError } =
    await supabaseClient.storage
      .from("property-photos")
      .upload(storagePath, file);

  if (uploadError) {
    console.error(uploadError);
    message.textContent =
      "Could not upload photo: " +
      uploadError.message;
    return;
  }

  const { error: databaseError } =
    await supabaseClient
      .from("property_photos")
      .insert({
        user_id: user.id,
        client_id: clientId,
        photo_url: storagePath,
        caption:
          captionInput.value.trim() || null
      });

  if (databaseError) {
    console.error(databaseError);

    // Don't leave an orphaned file behind.
    await supabaseClient.storage
      .from("property-photos")
      .remove([storagePath]);

    message.textContent =
      "Photo uploaded, but could not save its record: " +
      databaseError.message;

    return;
  }

  fileInput.value = "";
  captionInput.value = "";

  message.textContent = "Photo saved.";

  await loadPropertyPhotos(clientId);
}


async function loadPropertyPhotos(clientId) {
  const list =
    document.getElementById("propertyPhotoList");

  if (!list) return;

  const { data: photos, error } =
    await supabaseClient
      .from("property_photos")
      .select("*")
      .eq("client_id", clientId)
      .order("created_at", {
        ascending: false
      });

  if (error) {
    list.innerHTML = `
      <p class="empty">
        Could not load photos:
        ${escapeHtml(error.message)}
      </p>
    `;
    return;
  }

  if (!photos || photos.length === 0) {
    list.innerHTML = `
      <p class="empty">
        No property photos yet.
      </p>
    `;
    return;
  }

  const photoCards =
    await Promise.all(
      photos.map(async photo => {

        const { data, error: signedUrlError } =
          await supabaseClient.storage
            .from("property-photos")
            .createSignedUrl(
              photo.photo_url,
              3600
            );

        if (signedUrlError) {
          console.error(signedUrlError);
          return "";
        }

        return `
          <div style="
            margin-top:16px;
            border-top:1px solid #e4e9e6;
            padding-top:16px;
          ">

            <img
              src="${data.signedUrl}"
              alt="${escapeHtml(
                photo.caption || "Property photo"
              )}"
              style="
                width:100%;
                max-height:350px;
                object-fit:cover;
                border-radius:10px;
              ">

            <div style="
              margin-top:8px;
              font-size:14px;
            ">
              ${escapeHtml(
                photo.caption || "Property photo"
              )}
            </div>
<button
  class="secondary"
  onclick="deletePropertyPhoto(
    '${photo.id}',
    '${clientId}',
    '${photo.photo_url}'
  )"
  style="color:#a12622;margin-top:10px;">
  Delete Photo
</button>
          </div>
        `;
      })
    );

  list.innerHTML =
    photoCards.filter(Boolean).join("");
}

async function deletePropertyPhoto(
  photoId,
  clientId,
  photoPath
) {
  const confirmed = confirm(
    "Permanently delete this property photo? This cannot be undone."
  );

  if (!confirmed) return;

  const { error: storageError } =
    await supabaseClient.storage
      .from("property-photos")
      .remove([photoPath]);

  if (storageError) {
    console.error(storageError);

    alert(
      "Could not delete photo: " +
      storageError.message
    );

    return;
  }

  const { error: databaseError } =
    await supabaseClient
      .from("property_photos")
      .delete()
      .eq("id", photoId);

  if (databaseError) {
    console.error(databaseError);

    alert(
      "Photo was removed from storage, but its record could not be deleted: " +
      databaseError.message
    );

    return;
  }

  await loadPropertyPhotos(clientId);
}
  
async function loadClientJobs(
  clientId,
  showAll = false
) {
  const list =
    document.getElementById("clientJobList");

  if (!list) return;

  const today = new Date();

  const todayString =
    `${today.getFullYear()}-${String(
      today.getMonth() + 1
    ).padStart(2, "0")}-${String(
      today.getDate()
    ).padStart(2, "0")}`;

  const { data: jobs, error } =
    await supabaseClient
      .from("jobs")
      .select("*")
      .eq("client_id", clientId)
      .gte("scheduled_date", todayString)
      .neq("status", "Complete")
      .neq("status", "Cancelled")
      .order("scheduled_date", {
        ascending: true
      })
      .order("scheduled_time", {
        ascending: true
      });

  if (error) {
    list.innerHTML = `
      <p class="empty">
        Could not load jobs:
        ${escapeHtml(error.message)}
      </p>
    `;
    return;
  }

  if (!jobs || jobs.length === 0) {
    list.innerHTML = `
      <p class="empty">
        No upcoming jobs scheduled.
      </p>

      <button
        class="secondary"
        onclick="showJobHistory('${clientId}')">
        View Job History
      </button>
    `;
    return;
  }

  const jobsToDisplay =
    showAll
      ? jobs
      : jobs.slice(0, 3);

  const jobCards = jobsToDisplay.map(job => {
    const price =
      job.price != null
        ? `$${Number(job.price).toFixed(2)}`
        : "No price";

    const time =
      job.scheduled_time
        ? job.scheduled_time.slice(0, 5)
        : "No time";

    const recurrenceLabel =
      job.recurrence_type
        ? job.recurrence_type === "biweekly"
          ? "Every 2 Weeks"
          : job.recurrence_type
              .charAt(0)
              .toUpperCase() +
            job.recurrence_type.slice(1)
        : null;

async function saveJob(clientId) {
  const message =
    document.getElementById("jobMessage");

  const scheduledDate =
    document.getElementById("jobDate").value;

  const scheduledTime =
    document.getElementById("jobTime").value;

  const price =
    document.getElementById("jobPrice").value;

  const status =
    document.getElementById("jobStatus").value;

  const paymentStatus =
    document.getElementById("jobPaymentStatus").value;

  const recurrence =
  document.getElementById("jobRecurrence").value;
  
  const notes =
    document.getElementById("jobNotes").value.trim();

  if (!scheduledDate) {
    message.textContent =
      "Please select a service date.";
    return;
  }

  message.textContent = "Saving job...";

  const {
    data: { user }
  } = await supabaseClient.auth.getUser();

  if (!user) {
    message.textContent =
      "You must be logged in.";
    return;
  }

  const jobsToCreate = [];

const recurrenceId =
  recurrence !== "none"
    ? crypto.randomUUID()
    : null;
  
const firstDate =
  new Date(`${scheduledDate}T12:00:00`);

let totalJobs = 1;

if (recurrence === "weekly") {
  totalJobs = 12;
}

if (recurrence === "biweekly") {
  totalJobs = 8;
}

if (recurrence === "monthly") {
  totalJobs = 6;
}

for (let i = 0; i < totalJobs; i++) {
  const jobDate = new Date(firstDate);

  if (recurrence === "weekly") {
    jobDate.setDate(
      firstDate.getDate() + (i * 7)
    );
  }

  if (recurrence === "biweekly") {
    jobDate.setDate(
      firstDate.getDate() + (i * 14)
    );
  }

  if (recurrence === "monthly") {
    jobDate.setMonth(
      firstDate.getMonth() + i
    );
  }

  const formattedDate =
  `${jobDate.getFullYear()}-${String(
    jobDate.getMonth() + 1
  ).padStart(2, "0")}-${String(
    jobDate.getDate()
  ).padStart(2, "0")}`;

  jobsToCreate.push({
    user_id: user.id,
    client_id: clientId,
    recurrence_id: recurrenceId,
recurrence_type:
  recurrence !== "none"
    ? recurrence
    : null,
recurrence_end_date: null,
    scheduled_date: formattedDate,
    scheduled_time: scheduledTime || null,
    status: status,
    price: price ? Number(price) : null,
    payment_status: paymentStatus,
    notes: notes || null
  });
}

const { error } =
  await supabaseClient
    .from("jobs")
    .insert(jobsToCreate);

  if (error) {
    console.error(error);
    message.textContent =
      `Could not save job: ${error.message}`;
    return;
  }

  message.textContent = "Job saved.";

  await showClientProfile(clientId);
}

async function updateJob(jobId, clientId) {
  const message =
    document.getElementById("editJobMessage");

  const scheduledDate =
    document.getElementById("editJobDate").value;

  const scheduledTime =
    document.getElementById("editJobTime").value;

  const price =
    document.getElementById("editJobPrice").value;

  const status =
    document.getElementById("editJobStatus").value;

  const paymentStatus =
    document.getElementById(
      "editJobPaymentStatus"
    ).value;

  const notes =
    document.getElementById("editJobNotes")
      .value
      .trim();

const scopeElement =
  document.getElementById("editJobScope");

const scope =
  scopeElement
    ? scopeElement.value
    : "single";
  
  if (!scheduledDate) {
    message.textContent =
      "Please select a service date.";
    return;
  }

  message.textContent = "Saving changes...";

  const updates = {
    scheduled_date: scheduledDate,
    scheduled_time: scheduledTime || null,
    price: price ? Number(price) : null,
    status: status,
    payment_status: paymentStatus,
    notes: notes || null
  };

  if (status === "Complete") {
    updates.completed_at =
      new Date().toISOString();
  } else {
    updates.completed_at = null;
  }

  let error;

if (scope === "future") {
  const { data: currentJob, error: jobError } =
    await supabaseClient
      .from("jobs")
      .select("recurrence_id, scheduled_date")
      .eq("id", jobId)
      .single();

const originalDate =
  currentJob?.scheduled_date;

const dateChanged =
  originalDate &&
  scheduledDate !== originalDate;
  
  if (jobError || !currentJob?.recurrence_id) {
    error =
      jobError ||
      new Error("Recurring series could not be found.");
  } else {
    const { data: futureJobs, error: futureJobsError } =
  await supabaseClient
    .from("jobs")
    .select("id, scheduled_date")
    .eq("recurrence_id", currentJob.recurrence_id)
    .gte(
      "scheduled_date",
      currentJob.scheduled_date
    )
    .order("scheduled_date", {
      ascending: true
    });

if (futureJobsError) {
  error = futureJobsError;
} else {
  const original =
    new Date(`${originalDate}T12:00:00`);

  const changed =
    new Date(`${scheduledDate}T12:00:00`);

  const dayDifference =
    Math.round(
      (changed - original) /
      (1000 * 60 * 60 * 24)
    );

  for (const futureJob of futureJobs) {
    const oldDate =
      new Date(
        `${futureJob.scheduled_date}T12:00:00`
      );

    if (dateChanged) {
      oldDate.setDate(
        oldDate.getDate() + dayDifference
      );
    }

    const newDate =
  `${oldDate.getFullYear()}-${String(
    oldDate.getMonth() + 1
  ).padStart(2, "0")}-${String(
    oldDate.getDate()
  ).padStart(2, "0")}`;

    const isCurrentJob =
  futureJob.id === jobId;

const futureUpdates = {
  scheduled_date: newDate,
  scheduled_time: updates.scheduled_time,
  price: updates.price,
  notes: updates.notes
};

if (isCurrentJob) {
  futureUpdates.status = updates.status;
  futureUpdates.payment_status =
    updates.payment_status;
  futureUpdates.completed_at =
    updates.completed_at;
}

const result =
  await supabaseClient
    .from("jobs")
    .update(futureUpdates)
    .eq("id", futureJob.id);
    if (result.error) {
      error = result.error;
      break;
    }
  }
}
  }
} else {
  const result =
    await supabaseClient
      .from("jobs")
      .update(updates)
      .eq("id", jobId);

  error = result.error;
}

  if (error) {
    console.error(error);

    message.textContent =
      `Could not update job: ${error.message}`;

    return;
  }

  message.textContent = "Job updated.";

  await showClientProfile(clientId);
}

function buildDayOptions(current) {
  const days = [
    "",
    "Monday",
    "Tuesday",
    "Wednesday",
    "Thursday",
    "Friday",
    "Saturday",
    "Sunday"
  ];

  return days.map(day => {
    const label = day || "No preference";
    const selected = day === current ? "selected" : "";

    return `<option value="${day}" ${selected}>
      ${label}
    </option>`;
  }).join("");
}


function buildFrequencyOptions(current) {
  const frequencies = [
    "",
    "Weekly",
    "Biweekly",
    "Monthly",
    "One Time"
  ];

  return frequencies.map(frequency => {
    const label = frequency || "Select";
    const selected =
      frequency === current ? "selected" : "";

    return `<option value="${frequency}" ${selected}>
      ${label}
    </option>`;
  }).join("");
}

async function showInactiveClients() {
  app.innerHTML = `
    <div class="card">
      <h2>Inactive Clients</h2>

      <div id="inactiveClientList">
        <p class="empty">Loading inactive clients...</p>
      </div>

      <button
        class="secondary"
        onclick="returnToDashboard()">
        Back to Active Clients
      </button>
    </div>
  `;

  const { data, error } =
    await supabaseClient
      .from("clients")
      .select("*")
      .eq("active", false)
      .order("last_name", {
        ascending: true
      });

  const list =
    document.getElementById("inactiveClientList");

  if (error) {
    list.innerHTML = `
      <p class="empty">
        Could not load inactive clients:
        ${escapeHtml(error.message)}
      </p>
    `;
    return;
  }

  if (!data || data.length === 0) {
    list.innerHTML = `
      <p class="empty">
        No inactive clients.
      </p>
    `;
    return;
  }

  list.innerHTML = data.map(client => {
    const name =
      `${client.first_name || ""} ${client.last_name || ""}`.trim();

    return `
      <div class="client">
        <div class="client-name">
          ${escapeHtml(name)}
        </div>

        <div class="client-detail">
          ${escapeHtml(client.phone || "No phone number")}
        </div>

        <button
          onclick="reactivateClient('${client.id}')">
          Reactivate Client
        </button>
      </div>
    `;
  }).join("");
}


async function reactivateClient(clientId) {
  const { error } =
    await supabaseClient
      .from("clients")
      .update({ active: true })
      .eq("id", clientId);

  if (error) {
    alert(
      "Could not reactivate client: " +
      error.message
    );
    return;
  }

  await showInactiveClients();
}
  
  async function returnToDashboard() {
    const {
      data: { user }
    } = await supabaseClient.auth.getUser();

    if (user) {
      showDashboard(user);
    } else {
      showLogin();
    }
  }

  function showError(message) {
    app.innerHTML = `
      <div class="card">
        <h2>Connection Error</h2>
        <p>${escapeHtml(message)}</p>
      </div>
    `;
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  startApp();
</script>
