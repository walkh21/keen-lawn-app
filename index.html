      font-size: 14px;

      border-radius: 8px;
      font-size: 16px;
      background: white;

    textarea {

    button {

      margin-top: 18px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #1d6b45;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;

      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

      margin: 0;
      padding: 9px 14px;

async function uploadPropertyPhoto(clientId) {
  const fileInput =
    document.getElementById("propertyPhoto");

  const captionInput =
    document.getElementById("photoCaption");

  const message =
    document.getElementById("photoMessage");

  const file = fileInput.files[0];

  if (!file) {
    message.textContent =
      "Choose a photo first.";
    return;
  }

  message.textContent = "Uploading photo...";

  const {
    data: { user },
    error: userError
  } = await supabaseClient.auth.getUser();

  if (userError || !user) {
    message.textContent =
      "Your login session could not be verified.";
    return;
  }

  const extension =
    file.name.split(".").pop() || "jpg";

  const fileName =
    `${Date.now()}-${crypto.randomUUID()}.${extension}`;

  const storagePath =
    `${user.id}/${clientId}/${fileName}`;

  const { error: uploadError } =
    await supabaseClient.storage
      .from("property-photos")
      .upload(storagePath, file);

  if (uploadError) {
    console.error(uploadError);
    message.textContent =
      "Could not upload photo: " +
      uploadError.message;
    return;
  }

  const { error: databaseError } =
    await supabaseClient
      .from("property_photos")
      .insert({
        user_id: user.id,
        client_id: clientId,
        photo_url: storagePath,
        caption:
          captionInput.value.trim() || null
      });

  if (databaseError) {
    console.error(databaseError);

    // Don't leave an orphaned file behind.
    await supabaseClient.storage
      .from("property-photos")
      .remove([storagePath]);

    message.textContent =
      "Photo uploaded, but could not save its record: " +
      databaseError.message;

    return;
  }

  fileInput.value = "";
  captionInput.value = "";

  message.textContent = "Photo saved.";

  await loadPropertyPhotos(clientId);
}


async function loadPropertyPhotos(clientId) {
  const list =
    document.getElementById("propertyPhotoList");

  if (!list) return;

  const { data: photos, error } =
    await supabaseClient
      .from("property_photos")
      .select("*")
      .eq("client_id", clientId)
      .order("created_at", {
        ascending: false
      });

  if (error) {
    list.innerHTML = `
      <p class="empty">
        Could not load photos:
        ${escapeHtml(error.message)}
      </p>
    `;
    return;
  }

  if (!photos || photos.length === 0) {
    list.innerHTML = `
      <p class="empty">
        No property photos yet.
      </p>
    `;
    return;
  }

  const photoCards =
    await Promise.all(
      photos.map(async photo => {

        const { data, error: signedUrlError } =
          await supabaseClient.storage
            .from("property-photos")
            .createSignedUrl(
              photo.photo_url,
              3600
            );

        if (signedUrlError) {
          console.error(signedUrlError);
          return "";
        }

        return `
          <div style="
            margin-top:16px;
            border-top:1px solid #e4e9e6;
            padding-top:16px;
          ">

            <img
              src="${data.signedUrl}"
              alt="${escapeHtml(
                photo.caption || "Property photo"
              )}"
              style="
                width:100%;
                max-height:350px;
                object-fit:cover;
                border-radius:10px;
              ">

            <div style="
              margin-top:8px;
              font-size:14px;
            ">
              ${escapeHtml(
                photo.caption || "Property photo"
              )}
            </div>

          </div>
        `;
      })
    );

  list.innerHTML =
    photoCards.filter(Boolean).join("");
}

async function saveJob(clientId) {
  const message =
    document.getElementById("jobMessage");

  const scheduledDate =
    document.getElementById("jobDate").value;

  const scheduledTime =
    document.getElementById("jobTime").value;

  const price =
    document.getElementById("jobPrice").value;

  const status =
    document.getElementById("jobStatus").value;

  const paymentStatus =
    document.getElementById("jobPaymentStatus").value;

  const notes =
    document.getElementById("jobNotes").value.trim();

  if (!scheduledDate) {
    message.textContent =
      "Please select a service date.";
    return;
  }

  message.textContent = "Saving job...";

  const {
    data: { user }
  } = await supabaseClient.auth.getUser();

  if (!user) {
    message.textContent =
      "You must be logged in.";
    return;
  }

  const { error } =
    await supabaseClient
      .from("jobs")
      .insert({
        user_id: user.id,
        client_id: clientId,
        scheduled_date: scheduledDate,
        scheduled_time: scheduledTime || null,
        status: status,
        price: price ? Number(price) : null,
        payment_status: paymentStatus,
        notes: notes || null
      });

  if (error) {
    console.error(error);
    message.textContent =
      `Could not save job: ${error.message}`;
    return;
  }

  message.textContent = "Job saved.";

  await showClientProfile(clientId);
}
  
  async function deactivateClient(clientId) {
  const confirmed = confirm(
    "Deactivate this client? They will be removed from your active client list, but their information will remain saved."

  if (!confirmed) return;

  const { error } =
    await supabaseClient
      .from("clients")
      .update({ active: false })
      .eq("id", clientId);

  if (error) {
    alert(
      "Could not deactivate client: " +
      error.message
    );
    return;
  }

  await returnToDashboard();
}

        value="${escapeHtml(client.zip_code || "")}">

      <label>Acreage</label>
      <input id="editAcreage"
        type="number"
        step="0.01"
        min="0"
        value="${escapeHtml(client.acreage ?? "")}">

      <label>Yard Difficulty</label>
      <select id="editYardDifficulty">
        <option value="">Select</option>
        <option value="Easy"
          ${client.yard_difficulty === "Easy" ? "selected" : ""}>
          Easy
        </option>
        <option value="Average"
          ${client.yard_difficulty === "Average" ? "selected" : ""}>
          Average
        </option>
        <option value="Difficult"
          ${client.yard_difficulty === "Difficult" ? "selected" : ""}>
          Difficult
        </option>
      </select>

      <label>Preferred Service Day</label>
      <select id="editPreferredDay">
        ${buildDayOptions(client.preferred_day)}
      </select>

      <label>Service Frequency</label>
      <select id="editFrequency">
        ${buildFrequencyOptions(client.frequency)}
      </select>

      <label>Default Price</label>
      <input id="editDefaultPrice"
        type="number"
        step="0.01"
        min="0"
        value="${escapeHtml(client.default_price ?? "")}">

      <label>Gate Code</label>
      <input id="editGateCode"
        value="${escapeHtml(client.gate_code || "")}">

      <label>Pets / Yard Notes</label>
      <input id="editPets"
        value="${escapeHtml(client.pets || "")}">

      <label>Notes</label>
      <textarea id="editNotes">${escapeHtml(client.notes || "")}</textarea>

      <button onclick="updateClient('${client.id}')">
        Save Changes
      </button>

      <button class="secondary"
        onclick="showClientProfile('${client.id}')">
        Cancel
      </button>

      <div id="editMessage" class="message"></div>
    </div>
  `;
}


async function updateClient(clientId) {
  const message =
    document.getElementById("editMessage");

  const firstName =
    document.getElementById("editFirstName").value.trim();

  const lastName =
    document.getElementById("editLastName").value.trim();

  if (!firstName || !lastName) {
    message.textContent =
      "First and last name are required.";
    return;
  }

  message.textContent = "Saving changes...";

  const acreage =
    document.getElementById("editAcreage").value;

  const price =
    document.getElementById("editDefaultPrice").value;

  const updates = {
    first_name: firstName,
    last_name: lastName,
    phone:
      document.getElementById("editPhone").value.trim() || null,
    email:
      document.getElementById("editEmail").value.trim() || null,
    address:
      document.getElementById("editAddress").value.trim() || null,
    state:
      document.getElementById("editState").value.trim() || null,
    zip_code:
      document.getElementById("editZipCode").value.trim() || null,
    acreage: acreage ? Number(acreage) : null,
    yard_difficulty:
      document.getElementById("editYardDifficulty").value || null,
    preferred_day:
      document.getElementById("editPreferredDay").value || null,
    frequency:
      document.getElementById("editFrequency").value || null,
    default_price: price ? Number(price) : null,
    gate_code:
      document.getElementById("editGateCode").value.trim() || null,
    pets:
      document.getElementById("editPets").value.trim() || null,
    notes:
      document.getElementById("editNotes").value.trim() || null
  };

  const { error } =
    await supabaseClient
      .from("clients")
      .update(updates)
      .eq("id", clientId);

  if (error) {
    console.error(error);
    message.textContent =
      "Could not update client: " + error.message;
    return;
  }

  message.textContent = "Changes saved.";

  setTimeout(() => {
    showClientProfile(clientId);
  }, 400);
}


function buildDayOptions(current) {
  const days = [
    "",
    "Monday",
    "Tuesday",
    "Wednesday",
    "Thursday",
    "Friday",
    "Saturday",
    "Sunday"
  ];

  return days.map(day => {
    const label = day || "No preference";
    const selected = day === current ? "selected" : "";

    return `<option value="${day}" ${selected}>
      ${label}
    </option>`;
  }).join("");
}


function buildFrequencyOptions(current) {
  const frequencies = [
    "",
    "Weekly",
    "Biweekly",
    "Monthly",
    "One Time"
  ];

  return frequencies.map(frequency => {
    const label = frequency || "Select";
    const selected =
      frequency === current ? "selected" : "";

    return `<option value="${frequency}" ${selected}>
      ${label}
    </option>`;
  }).join("");
}

async function showInactiveClients() {
  app.innerHTML = `
    <div class="card">
      <h2>Inactive Clients</h2>

      <div id="inactiveClientList">
        <p class="empty">Loading inactive clients...</p>
      </div>

      <button
        class="secondary"
        onclick="returnToDashboard()">
        Back to Active Clients
      </button>
    </div>
  `;

  const { data, error } =
    await supabaseClient
      .from("clients")
      .select("*")
      .eq("active", false)
      .order("last_name", {
        ascending: true
      });

  const list =
    document.getElementById("inactiveClientList");

  if (error) {
    list.innerHTML = `
      <p class="empty">
        Could not load inactive clients:
        ${escapeHtml(error.message)}
      </p>
    `;
    return;
  }

  if (!data || data.length === 0) {
    list.innerHTML = `
      <p class="empty">
        No inactive clients.
      </p>
    `;
    return;
  }

  list.innerHTML = data.map(client => {
    const name =
      `${client.first_name || ""} ${client.last_name || ""}`.trim();

    return `
      <div class="client">
        <div class="client-name">
          ${escapeHtml(name)}
        </div>

        <div class="client-detail">
          ${escapeHtml(client.phone || "No phone number")}
        </div>

        <button
          onclick="reactivateClient('${client.id}')">
          Reactivate Client
        </button>
      </div>
    `;
  }).join("");
}


async function reactivateClient(clientId) {
  const { error } =
    await supabaseClient
      .from("clients")
      .update({ active: true })
      .eq("id", clientId);

  if (error) {
    alert(
      "Could not reactivate client: " +
      error.message
    );
    return;
  }

  await showInactiveClients();
}
  
  async function returnToDashboard() {
    const {
      data: { user }
    } = await supabaseClient.auth.getUser();

    if (user) {
      showDashboard(user);
    } else {
      showLogin();
    }
  }

  function showError(message) {
    app.innerHTML = `
      <div class="card">
        <h2>Connection Error</h2>
        <p>${escapeHtml(message)}</p>
      </div>
    `;
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  startApp();
</script>
