<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">

  <title>Keen Lawn</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f5;
      color: #17211b;
    }

    header {
      background: #163d2a;
      color: white;
      padding: 22px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
    }

    header p {
      margin: 5px 0 0;
      opacity: .8;
      font-size: 14px;
    }

    main {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 5px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccd4cf;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #1d6b45;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #status {
      margin-top: 14px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  <h1>Keen Lawn</h1>
  <p>Lawn Business Manager</p>
</header>

<main>

  <div class="card">
    <h2>Supabase Connection</h2>
    <p id="connectionStatus">Checking connection...</p>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL =
    "https://woqiwcweqagsyvugwajp.supabase.co";

  const SUPABASE_KEY =
    "select
  table_name || '.' || column_name as field
from information_schema.columns
where table_schema = 'public'
order by table_name, ordinal_position;";

  const supabaseClient =
    supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  async function testConnection() {
    const status =
      document.getElementById("connectionStatus");

    try {
      const { data, error } =
        await supabaseClient
          .from("clients")
          .select("id")
          .limit(1);

      if (error) {
        status.textContent =
          "Database reached. Login setup is next.";
        console.log(error);
        return;
      }

      status.textContent =
        "✓ Connected to Keen Lawn database";
    } catch (error) {
      status.textContent =
        "Connection error — check configuration.";
      console.error(error);
    }
  }

  testConnection();
</script>

</body>
</html>
