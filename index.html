<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">

  <title>Keen Lawn</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f5;
      color: #17211b;
    }

    header {
      background: #163d2a;
      color: white;
      padding: 22px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
    }

    header p {
      margin: 5px 0 0;
      opacity: .8;
      font-size: 14px;
    }

    main {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 5px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccd4cf;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #1d6b45;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #status {
      margin-top: 14px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  <h1>Keen Lawn</h1>
  <p>Lawn Business Manager</p>
</header>

<main>

  <div class="card">
    <h2>Supabase Connection</h2>
    <p id="connectionStatus">Checking connection...</p>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL =
    "https://woqiwcweqagsyvugwajp.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable,-_uAk%2D0tRNAxH4zGJ1%2Dn_rqA_h01GHS7W";

  const supabaseClient =
    supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function checkSession() {
  const statusBox = document.querySelector(".card");

  try {
    const { data: { session }, error } =
      await supabaseClient.auth.getSession();

    if (error) throw error;

    if (session) {
      statusBox.innerHTML = `
        <h2>Keen Lawn</h2>
        <p>Logged in as ${session.user.email}</p>
        <button onclick="logout()">Log Out</button>
      `;
    } else {
      statusBox.innerHTML = `
        <h2>Sign In</h2>
        <p>Log in to manage your lawn business.</p>

        <input
          id="email"
          type="email"
          placeholder="Email address"
        >

        <input
          id="password"
          type="password"
          placeholder="Password"
        >

        <button onclick="login()">Sign In</button>

        <p id="loginMessage"></p>
      `;
    }
  } catch (error) {
    statusBox.innerHTML = `
      <h2>Connection Error</h2>
      <p>${error.message}</p>
    `;
  }
}

async function login() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const message = document.getElementById("loginMessage");

  message.textContent = "Signing in...";

  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if (error) {
    message.textContent = error.message;
    return;
  }

  message.textContent = "Login successful.";
  checkSession();
}

async function logout() {
  await supabaseClient.auth.signOut();
  checkSession();
}

checkSession();
</script>
</body>
</html>
